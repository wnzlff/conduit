name: Release

# Builds a Windows package with PyInstaller whenever a version tag (v1.2.3) is pushed
# and attaches the zip to the GitHub release for that tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean conduit.spec
      - name: Package
        shell: pwsh
        run: |
          $version = (python -c "import conduit; print(conduit.__version__)").Trim()
          Compress-Archive -Path "dist\Conduit\*" -DestinationPath "dist\Conduit-$version-windows-x64.zip"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Smoke test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Conduit\Conduit.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Conduit.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: Conduit-windows-x64
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
